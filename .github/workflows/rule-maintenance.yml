name: Daily rule maintenance

on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rule-maintenance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Update sources and check external dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python 99_生成脚本/sync_rules.py
      - name: Generate and validate site
        run: |
          python 99_生成脚本/build_pages.py
          python 99_生成脚本/validate_site.py
          python -m unittest discover -s 99_生成脚本 -p 'test_*.py'
          npm test --prefix 01_网站源码
          node --check 01_网站源码/site/app.js
      - name: Commit validated snapshot
        run: |
          git add 01_网站源码/site
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '维护：同步已验证的去广告规则'
            git push origin HEAD:main
          fi
      - name: Restore wrangler credentials from repository secret
        env:
          CF_OAUTH_CONFIG_B64: ${{ secrets.CLOUDFLARE_OAUTH_CONFIG_B64 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_OAUTH_CONFIG_B64" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Live deployment requires CLOUDFLARE_OAUTH_CONFIG_B64 and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/.wrangler/config"
          printf '%s' "$CF_OAUTH_CONFIG_B64" | base64 -d > "$XDG_CONFIG_HOME/.wrangler/config/default.toml"
          chmod 600 "$XDG_CONFIG_HOME/.wrangler/config/default.toml"
          echo "wrangler credentials restored ($(wc -c < "$XDG_CONFIG_HOME/.wrangler/config/default.toml") bytes)"
      - name: Deploy to Cloudflare
        run: |
          cd 01_网站源码
          npx --yes wrangler@4.149.0 deploy
